<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" />
    <title>Cognibot</title>
  </head>
  <body>
    <div id="app">
      <header class="top">
        <button class="icon-btn" id="settingsBtn" aria-label="Settings">
          <svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7Zm7.4-3.5c0-.4 0-.8-.1-1.2l2-1.6-2-3.4-2.4.9a7.6 7.6 0 0 0-2-1.2L14.5 3h-4l-.4 2.5c-.7.3-1.4.7-2 1.2l-2.4-.9-2 3.4 2 1.6a8 8 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-.9c.6.5 1.3.9 2 1.2l.4 2.5h4l.4-2.5c.7-.3 1.4-.7 2-1.2l2.4.9 2-3.4-2-1.6c.1-.4.1-.8.1-1.2Z"/></svg>
        </button>
        <div class="title">
          <h1>Cognibot</h1>
          <div class="status" id="status"><span class="dot"></span><span id="statusText">Offline</span></div>
        </div>
        <button class="icon-btn" id="clearBtn" aria-label="Clear log">
          <svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7L6 7Zm3-3h6l1 2H8l1-2Z"/></svg>
        </button>
      </header>

      <section class="battery" id="batteryRow" hidden>
        <div class="bat"><div class="bat-fill" id="batFill"></div></div>
        <span id="batText">--%</span>
      </section>

      <section class="hero" id="heroReal">
        <img src="/car.jpg" alt="Cognibot robot car" id="car" />
      </section>

      <section class="simview" id="simView" hidden>
        <iframe id="simFrame" title="Live house view" allow="autoplay"></iframe>
        <div class="simBadge">● SIM — live view</div>
      </section>

      <section class="connect" id="connectView">
        <button class="primary" id="connectBtn">Connect</button>
        <p class="hint" id="connectHint">Make sure the server is running on your laptop.</p>
      </section>

      <section class="connected" id="connectedView" hidden>
        <div class="quick">
          <button class="round" id="stopBtn"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg><span>Stop</span></button>
          <button class="round" id="batteryBtn"><svg viewBox="0 0 24 24"><path d="M16 4h-2V2h-4v2H8a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1Z"/></svg><span>Battery</span></button>
          <button class="round" id="resetBtn"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z"/></svg><span>Reset</span></button>
          <button class="round" id="disconnectBtn"><svg viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3Zm4.8 2.2-1.4 1.4A6 6 0 1 1 7.6 6.6L6.2 5.2a8 8 0 1 0 11.6 0Z"/></svg><span>Disconnect</span></button>
        </div>

        <ul class="rows">
          <li><span class="k">Position</span><span class="v" id="posText">0.0 m, 0.0 m</span></li>
          <li><span class="k">Heading</span><span class="v" id="headText">0°</span></li>
          <li><span class="k">Server</span><span class="v" id="srvText">-</span></li>
        </ul>

        <h2 class="section">Commands</h2>
        <div id="log" class="log"></div>
      </section>
    </div>

    <footer class="dock" id="dock" hidden>
      <div class="live" id="live"></div>
      <form id="cmdForm">
        <input id="cmdInput" type="text" placeholder="Tell the robot what to do…" autocomplete="off" />
        <button type="submit" class="send" id="sendBtn" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M3 20v-6l9-2-9-2V4l19 8L3 20Z"/></svg></button>
        <button type="button" class="mic" id="micBtn" aria-label="Hold to talk"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12h-2Z"/></svg></button>
      </form>
      <div class="micHint">Hold the mic to talk</div>
    </footer>

    <dialog id="settings">
      <form method="dialog" id="settingsForm">
        <h3>Server</h3>
        <label>Laptop address
          <input id="serverInput" type="url" placeholder="http://192.168.1.20:8000" />
        </label>
        <p class="hint">On a phone, use your laptop's LAN IP. Run the server with <code>--host 0.0.0.0</code>.</p>
        <div class="dlg-actions">
          <button value="cancel" class="ghost">Cancel</button>
          <button value="ok" class="primary small">Save</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
